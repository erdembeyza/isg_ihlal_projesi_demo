services:
  postgres:
    image: postgres:16-alpine
    container_name: isg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isg_ihlal_db
      POSTGRES_USER: isg_admin
      POSTGRES_PASSWORD: isg_admin_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isg_admin -d isg_ihlal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: isg_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@isg.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/tmp/pgpass:ro
    entrypoint: >
      /bin/sh -c "
      cp /tmp/pgpass /var/lib/pgadmin/pgpass &&
      chown pgadmin:root /var/lib/pgadmin/pgpass &&
      chmod 600 /var/lib/pgadmin/pgpass &&
      /entrypoint.sh
      "
    depends_on:
      - postgres

volumes:
  postgres_data:
    external: true
    name: isg_ihlal_projesi_postgres_data
  pgadmin_data:
