<div class="panel-shell">

  <header class="panel-header" role="banner">
    <div class="ph-marka">
      <img
        src="/assets/images/erdemir-logo-large.png"
        alt="OYAK Maden Metalurji"
        class="ph-oyak-logo"
      />
      <div class="ph-marka-ayirici" aria-hidden="true"></div>
      <div class="ph-erdemir-bilgi">
        @if (panelAdi) {
          <span class="ph-panel-adi">{{ panelAdi }}</span>
        }
      </div>
    </div>

    <div class="ph-sag">
      <ng-content select="[panelButonlari]" />
      <div class="ph-kullanici-blok">
        <button
          type="button"
          class="ph-kullanici"
          (click)="profiliAc()"
          aria-label="Profil ve hesap ayarlarını aç"
          [attr.aria-expanded]="profilAcik()"
        >
          <div class="ph-avatar" aria-hidden="true">
            {{ avatarHarf() }}
          </div>
          <div class="ph-kullanici-detay">
            <span class="ph-ad-soyad">{{ kullaniciAdi }}</span>
            <span class="ph-rol">{{ rolEtiketiMetni() }}</span>
          </div>
          <span class="ph-profil-ok" aria-hidden="true">▾</span>
        </button>
        <span class="ph-tarih-saat" aria-live="polite">{{ tarihSaatMetni() }}</span>
      </div>
    </div>
  </header>

  <main class="panel-icerik-alani">
    <ng-content />
  </main>

  <app-extranet-footer />
</div>

<app-profil-paneli
  [acik]="profilAcik()"
  (kapandi)="profiliKapat()"
  (cikis)="onCikisYap()"
/>

@if (isYonetici()) {
  <app-kullanici-yonetim-sayfasi
    [acik]="kullaniciYonetimAcik()"
    (kapandi)="kullaniciYonetiminiKapat()"
  />
}
